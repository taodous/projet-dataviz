[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so_ai"
version = "0.1.0"
description = "Analysis package for the Stack Overflow Developer Survey 2026 (AI theme, sponsor Numeum)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
